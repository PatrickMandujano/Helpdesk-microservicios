# Configuración para el Helpdesk Ticket Service
server.port=8082

# Conexión a Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Forzar hostname manualmente
spring.cloud.client.hostname=localhost

# Evitar que use la IP detectada automáticamente
eureka.instance.prefer-ip-address=false

# Forzar hostname manualmente (IMPORTANTE)
eureka.instance.hostname=localhost

# Conexión a la Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/tickets_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=update
